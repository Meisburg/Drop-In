<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Drop In">
  <!-- V7: the playground mark in the brand hue, on no background at all — a tab
       icon is drawn on the browser's own chrome, so a tile would fight it, and
       mono keeps it legible at 16px where a second hue would only muddy.
       Same geometry as src/components/DropInMark.tsx and the app icon. -->
