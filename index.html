<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- V22 slice 14: appearance is a USER CHOICE (light default; dark opt-in
         via the /settings switch), so the OS media-query pair is gone. ONE
         static theme-color ships the light value (#e8552f); ThemeToggle.tsx
         updates this tag at runtime to #181412 when the user picks dark. -->
    <meta name="theme-color" content="#e8552f" />
    <meta
      name="description"
      content="Drop In — drop-in playdates for Seattle families. Post a time and place; come by if you like."
    />
    <!-- Installed-app behaviour (V4 slice 3): standalone launch on iOS, status
         bar left to the system so the white header keeps readable text. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Drop In" />
    <!-- iOS startup images (the native half of the splash). Regenerate with
         scripts/build-splash.mjs — it prints these tags so the list can't drift. -->
    <link
      rel="apple-touch-startup-image"
      href="/splash/1290x2796.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/1179x2556.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/1284x2778.png"
      media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/1170x2532.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/1125x2436.png"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/828x1792.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/750x1334.png"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/1536x2048.png"
      media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2)"
    />
    <title>Drop In</title>
    <!-- V22 slice 14: NO FLASH OF WRONG THEME. The app no longer follows the OS
         by default; a stored dark choice must paint dark on every cold load, so
         this runs BEFORE the module script and sets <html data-theme="dark">
         synchronously (index.css keys its dark tokens off that attribute).
         V27 adds the stored 'system' choice: it resolves against the OS
         preference HERE, before paint, so "match my phone" is flash-free too.
         try/catch is required: localStorage throws in some privacy modes, and a
         throw here would blank the whole page. Absent/garbage key = light. -->
    <script>
      try {
        var choice = localStorage.getItem('dropin-theme')
        var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)')
        var dark = choice === 'dark' || (choice === 'system' && !!mq && mq.matches)
        if (dark) {
          document.documentElement.setAttribute('data-theme', 'dark')
          // Also point the browser-chrome meta at the dark neutral, in the SAME
          // pre-paint pass. The app ships one static (light) meta because it no
          // longer consults prefers-color-scheme, so without this a returning
          // dark user saw terracotta chrome on every route until they happened
          // to open /settings (where ThemeToggle reconciles it). Found by
          // scripts/theme-contract-check.mjs case 6.
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', '#181412')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Static boot splash: the FIRST painted frame, before the JS bundle has
           parsed — so a cold start is brand, never a white flash. SplashScreen
           removes it on mount and continues from this exact frame: same mark,
           same wordmark, same sizes, same 16px gap (see SplashScreen.tsx — the
           mark is 112px, the wordmark 32px/40px, the field is the brand hue
           indigo-500 in index.css, #e8552f). The face falls back to the system
           stack for the few frames before the self-hosted woff2 lands.

           V22 slice 14: the inline background is the LIGHT fallback; when the
           pre-paint script above set data-theme="dark", index.css re-points
           this very element's background to the dark page neutral (#181412) so
           a stored-dark user does not flash a terracotta frame on every cold
           load. -->
      <div
        id="boot-splash"
        style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #e8552f"
      >
        <svg viewBox="0 0 64 64" width="112" height="112" aria-hidden="true">
          <g fill="#ffffff">
            <circle cx="15" cy="21" r="10" />
            <circle cx="23" cy="26" r="6.5" fill-opacity=".75" />
            <rect x="12.5" y="28" width="5" height="18" rx="2.5" />
            <rect x="28" y="12" width="14" height="9" rx="4.5" />
          </g>
          <g stroke="#ffffff" stroke-linecap="round" fill="none">
            <path d="M38 19 L51 41" stroke-width="8.5" />
            <path d="M31.5 22 L31.5 45 M37.5 22 L37.5 45" stroke-width="3.6" />
            <path d="M31.5 30 L37.5 30 M31.5 37.5 L37.5 37.5" stroke-width="3" />
          </g>
          <rect x="7" y="48" width="50" height="6.5" rx="3.25" fill="#ffffff" fill-opacity=".45" />
        </svg>
        <p
          style="margin: 0; font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; font-weight: 700; font-size: 32px; line-height: 40px; color: #ffffff"
        >
          Drop In
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
